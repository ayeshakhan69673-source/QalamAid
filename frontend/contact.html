<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Global Styles */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #333;
}

/* Header & Navigation */
header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 10px 20px;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}


nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 0.9rem;
}

.nav-buttons button {
    padding: 8px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-left: 10px;
}

.apply-now {
    background:#00796b;
    color: #fff;
}

.donate-now {
    background:#00796b;
    color: #fff;
}

.form-status {
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    margin-bottom: 16px;
}

.form-status.ok {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #6ee7b7;
    display: block;
}

.form-status.err {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #fca5a5;
    display: block;
}

.send-message:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

    </style>
</head>
<body>
    <header>
        <nav>
           
            <ul>
               <li><a href="index.html">Home</a></li>
               <li><a href="howitworks.html">How It Works</a></li>                
                <li><a href="about.html">About Us</a></li>                       
                <li><a href="browsestudents.html">Browse Students</a></li>
               
            </ul>
            <div class="nav-buttons">
                <button class="apply-now"onclick="location.href='Applyforscholarship.html'">Apply Now</button>
                <button class="donate-now"onclick="location.href='donatenow.html'">Donate Now</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-banner">
            <h1>Contact Us</h1>
            <p>Have questions? We'd love to hear from you.</p>
        </section>

        <section class="contact-content">
            <div class="contact-form">
                <div class="form-status" id="formStatus"></div>
                <form id="contactForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject">
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" required></textarea>
                    </div>
                    <button type="submit" class="send-message" id="sendBtn">Send Message</button>
                </form>
            </div>

            <div class="contact-info">
                <h3>Get in Touch</h3>
                <p>Whether you're a student, donor, or potential partner, we're here to help.</p>
                <div class="info-item">
                    <span>Email:</span>
                    <a href="mailto:aidqalam@gmail.com">aidqalam@gmail.com</a>
                </div>
                <div class="info-item">
                    <span>Phone:</span>
                    <a href="tel:03125101169">0312-5101169</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script>
        const contactForm = document.getElementById('contactForm');
        const sendBtn = document.getElementById('sendBtn');
        const formStatus = document.getElementById('formStatus');

        function showStatus(msg, type) {
            formStatus.innerText = msg;
            formStatus.className = 'form-status ' + (type === 'error' ? 'err' : 'ok');
        }

        contactForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                showStatus('Please fill in your name, email, and message.', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = 'Sending...';
            formStatus.style.display = 'none';

            try {
                const res = await fetch(`${window.QALAM_API_BASE}/api/contact`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, subject, message })
                });
                const data = await res.json();

                if (res.ok) {
                    showStatus('✅ ' + data.message, 'ok');
                    contactForm.reset();
                } else {
                    showStatus('❌ ' + (data.message || 'Something went wrong. Please try again.'), 'error');
                }
            } catch (err) {
                showStatus('❌ Could not reach the server. Please try again shortly.', 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Send Message';
            }
        });
    </script>
    <script src="js/chatbot-widget.js"></script>
</body>
</html>
